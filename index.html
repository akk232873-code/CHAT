<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rayyan AI Assistant</title>
    
    <!-- Tailwind CSS for Premium Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Premium Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Glassmorphism utilities */
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        body { background-color: #020617; color: #f8fafc; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- PREMIUM ICONS (SVG) ---
        const Icons = {
            Sparkles: ({ className = "" }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-5 h-5 ${className}`}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z"/><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"/></svg>,
            Image: ({ className = "" }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-5 h-5 ${className}`}><rect width="18" height="18" x="3" y="3" rx="4" ry="4"/><circle cx="9" cy="9" r="2.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Send: ({ className = "" }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-5 h-5 ${className}`}><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Menu: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Plus: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            MessageSquare: ({ className = "" }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`w-4 h-4 ${className}`}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
            Trash: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Settings: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Copy: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Check: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-emerald-400"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Download: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            User: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        };

        function App() {
            // STATE MANAGEMENT
            const [sessions, setSessions] = useState([{ id: 'sess-1', title: 'New Chat', messages: [] }]);
            const [activeSession, setActiveSession] = useState('sess-1');
            const [input, setInput] = useState('');
            const [mode, setMode] = useState('chat'); // 'chat' | 'art'
            const [isGenerating, setIsGenerating] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 1024);
            const [showSettings, setShowSettings] = useState(false);
            const [copiedId, setCopiedId] = useState(null);
            
            const [systemInstruction, setSystemInstruction] = useState(
                "You are Rayyan AI, an elite, helpful, and highly intelligent AI assistant. Provide well-structured, creative, and highly accurate responses. Use markdown formatting for readability."
            );

            const messagesEndRef = useRef(null);

            // Auto Scroll
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [sessions, isGenerating]);

            // Handle Resize for Sidebar
            useEffect(() => {
                const handleResize = () => setSidebarOpen(window.innerWidth >= 1024);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const currentSession = sessions.find(s => s.id === activeSession) || sessions[0];

            // ROBUST API CALLER WITH RETRY
            const executeApi = async (url, payload, maxRetries = 3) => {
                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error("API Error");
                        return await response.json();
                    } catch (err) {
                        if (i === maxRetries - 1) throw err;
                        await new Promise(res => setTimeout(res, 1000 * Math.pow(2, i)));
                    }
                }
            };

            // SEND MESSAGE LOGIC
            const handleSend = async (e) => {
                if (e) e.preventDefault();
                if (!input.trim() || isGenerating) return;

                const text = input.trim();
                setInput('');
                
                // Add User Message
                const userMsg = { id: Date.now().toString(), role: 'user', type: 'text', content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                
                setSessions(prev => prev.map(s => {
                    if (s.id === activeSession) {
                        const isFirst = s.messages.length === 0;
                        return { ...s, title: isFirst ? text.slice(0, 20) + '...' : s.title, messages: [...s.messages, userMsg] };
                    }
                    return s;
                }));

                setIsGenerating(true);

                try {
                    const apiKey = ""; // Canvas environment handles this automatically

                    if (mode === 'chat') {
                        // GEMINI 2.5 FLASH TEXT API
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: text }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        };
                        
                        const data = await executeApi(url, payload);
                        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate a response.";
                        
                        const aiMsg = { id: (Date.now()+1).toString(), role: 'bot', type: 'text', content: reply, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                        setSessions(prev => prev.map(s => s.id === activeSession ? { ...s, messages: [...s.messages, aiMsg] } : s));
                    } else {
                        // IMAGEN 4.0 IMAGE API
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                        const payload = { instances: { prompt: text }, parameters: { sampleCount: 1 } };
                        
                        const data = await executeApi(url, payload);
                        const base64 = data.predictions?.[0]?.bytesBase64Encoded;
                        if (!base64) throw new Error("Image failed");
                        
                        const imgUrl = `data:image/png;base64,${base64}`;
                        const aiMsg = { id: (Date.now()+1).toString(), role: 'bot', type: 'image', content: imgUrl, prompt: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                        setSessions(prev => prev.map(s => s.id === activeSession ? { ...s, messages: [...s.messages, aiMsg] } : s));
                    }
                } catch (error) {
                    const errorMsg = { id: (Date.now()+1).toString(), role: 'bot', type: 'text', content: "⚠️ Connection Error. Please try again.", time: '' };
                    setSessions(prev => prev.map(s => s.id === activeSession ? { ...s, messages: [...s.messages, errorMsg] } : s));
                } finally {
                    setIsGenerating(false);
                }
            };

            // UTILS
            const copyToClipboard = (text, id) => {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
            };

            const downloadImage = (url, name) => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `RayyanArt-${name}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const createNewChat = () => {
                const newId = `sess-${Date.now()}`;
                setSessions([{ id: newId, title: 'New Chat', messages: [] }, ...sessions]);
                setActiveSession(newId);
                if(window.innerWidth < 1024) setSidebarOpen(false);
            };

            const deleteChat = (id, e) => {
                e.stopPropagation();
                const filtered = sessions.filter(s => s.id !== id);
                if (filtered.length === 0) {
                    const newId = `sess-${Date.now()}`;
                    setSessions([{ id: newId, title: 'New Chat', messages: [] }]);
                    setActiveSession(newId);
                } else {
                    setSessions(filtered);
                    if (activeSession === id) setActiveSession(filtered[0].id);
                }
            };

            // MARKDOWN PARSER (For Bold and Code Blocks)
            const parseMarkdown = (text) => {
                if (!text) return null;
                const parts = text.split(/(```[\s\S]*?```)/g);
                return parts.map((part, index) => {
                    if (part.startsWith('```')) {
                        const lines = part.split('\n');
                        const lang = lines[0].replace('```', '').trim() || 'code';
                        const code = lines.slice(1, -1).join('\n');
                        return (
                            <div key={index} className="my-4 rounded-lg bg-[#0d1117] border border-slate-700 overflow-hidden shadow-lg">
                                <div className="flex justify-between items-center px-4 py-2 bg-[#161b22] border-b border-slate-700">
                                    <span className="text-xs text-slate-400 font-mono uppercase">{lang}</span>
                                    <button onClick={() => copyToClipboard(code, `code-${index}`)} className="flex items-center gap-1 text-xs text-slate-300 hover:text-white transition-colors">
                                        {copiedId === `code-${index}` ? <Icons.Check /> : <Icons.Copy />}
                                        {copiedId === `code-${index}` ? "Copied" : "Copy"}
                                    </button>
                                </div>
                                <pre className="p-4 overflow-x-auto text-sm text-emerald-300 font-mono"><code>{code}</code></pre>
                            </div>
                        );
                    }
                    // Parse Bold **text**
                    const formatted = part.split('\n').map((line, i) => {
                        const chunks = line.split(/(\*\*.*?\*\*)/g).map((chunk, j) => {
                            if (chunk.startsWith('**') && chunk.endsWith('**')) {
                                return <strong key={j} className="text-white font-bold">{chunk.slice(2, -2)}</strong>;
                            }
                            return chunk;
                        });
                        return <p key={i} className="mb-2 leading-relaxed">{chunks}</p>;
                    });
                    return <div key={index} className="text-slate-200">{formatted}</div>;
                });
            };

            const suggestions = {
                chat: ["Write a professional email", "Explain quantum physics", "Write a Python script for web scraping"],
                art: ["A futuristic cyberpunk city at night", "A cute astronaut cat on Mars", "A hyper-realistic mountain landscape"]
            };

            return (
                <div className="flex h-screen bg-[#020617] text-slate-200">
                    
                    {/* SIDEBAR */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-40 w-72 bg-[#09090b] border-r border-slate-800 transition-transform duration-300 flex flex-col ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        {/* Header */}
                        <div className="p-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-purple-500/20">R</div>
                                <span className="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Rayyan AI</span>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 hover:text-white"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
                        </div>
                        
                        {/* New Chat Btn */}
                        <div className="px-4 pb-4">
                            <button onClick={createNewChat} className="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium transition-colors border border-slate-700">
                                <Icons.Plus /> New Chat
                            </button>
                        </div>

                        {/* History List */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar px-3 space-y-1">
                            <p className="px-2 pb-2 text-xs font-semibold text-slate-500 uppercase">Recent Chats</p>
                            {sessions.map(s => (
                                <div key={s.id} onClick={() => { setActiveSession(s.id); if(window.innerWidth < 1024) setSidebarOpen(false); }} className={`group flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all ${s.id === activeSession ? 'bg-indigo-600/20 text-indigo-300' : 'hover:bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                                    <div className="flex items-center gap-3 overflow-hidden">
                                        <Icons.MessageSquare className={s.id === activeSession ? "text-indigo-400" : ""} />
                                        <span className="truncate text-sm">{s.title}</span>
                                    </div>
                                    <button onClick={(e) => deleteChat(s.id, e)} className="opacity-0 group-hover:opacity-100 hover:text-red-400 p-1"><Icons.Trash /></button>
                                </div>
                            ))}
                        </div>

                        {/* User / Settings Footer */}
                        <div className="p-4 border-t border-slate-800 space-y-2">
                            <button onClick={() => setShowSettings(true)} className="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800 text-sm text-slate-300 transition-colors">
                                <Icons.Settings /> Persona Settings
                            </button>
                            <div className="flex items-center gap-3 p-2 text-sm text-slate-400">
                                <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div> Gemini Engine Active
                            </div>
                        </div>
                    </aside>

                    {/* Mobile Backdrop */}
                    {sidebarOpen && <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 bg-black/60 z-30 lg:hidden"></div>}

                    {/* MAIN CHAT AREA */}
                    <main className="flex-1 flex flex-col relative h-full w-full">
                        
                        {/* Header (Glassmorphism) */}
                        <header className="glass-panel h-16 flex items-center justify-between px-4 sticky top-0 z-20">
                            <div className="flex items-center gap-3">
                                {!sidebarOpen && <button onClick={() => setSidebarOpen(true)} className="text-slate-300 hover:text-white p-1"><Icons.Menu /></button>}
                                
                                {/* Mode Toggle */}
                                <div className="flex bg-slate-900 rounded-lg p-1 border border-slate-800">
                                    <button onClick={() => setMode('chat')} className={`flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all ${mode === 'chat' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                        <Icons.Sparkles className={mode === 'chat' ? 'text-indigo-400' : ''}/> Chat
                                    </button>
                                    <button onClick={() => setMode('art')} className={`flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition-all ${mode === 'art' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>
                                        <Icons.Image className={mode === 'art' ? 'text-pink-400' : ''}/> Art
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Chat History View */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8">
                            {currentSession.messages.length === 0 ? (
                                <div className="max-w-2xl mx-auto h-full flex flex-col items-center justify-center text-center mt-10">
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white text-3xl mb-6 shadow-xl shadow-purple-500/20">R</div>
                                    <h1 className="text-3xl md:text-4xl font-bold mb-3 text-white">How can I help you today?</h1>
                                    <p className="text-slate-400 mb-10">I am Rayyan AI. I can write code, generate text, and create stunning images.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full">
                                        {(mode === 'chat' ? suggestions.chat : suggestions.art).map((sugg, i) => (
                                            <button key={i} onClick={() => setInput(sugg)} className="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:bg-slate-800 hover:border-indigo-500/50 text-left text-sm text-slate-300 transition-all shadow-sm hover:shadow-indigo-500/10">
                                                {sugg}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="max-w-3xl mx-auto space-y-6 pb-6">
                                    {currentSession.messages.map((msg, idx) => (
                                        <div key={idx} className={`flex gap-4 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'}`}>
                                            {/* Avatar */}
                                            <div className={`w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${msg.role === 'user' ? 'bg-slate-700' : 'bg-gradient-to-tr from-indigo-500 to-purple-600'}`}>
                                                {msg.role === 'user' ? <Icons.User /> : <span className="text-xs font-bold text-white">R</span>}
                                            </div>
                                            
                                            {/* Message Bubble */}
                                            <div className={`group relative max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 ${msg.role === 'user' ? 'bg-slate-800 text-white rounded-tr-sm' : 'bg-transparent text-slate-200'}`}>
                                                
                                                {msg.type === 'text' ? (
                                                    <div className="text-[15px]">{parseMarkdown(msg.content)}</div>
                                                ) : (
                                                    <div className="rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                                                        <img src={msg.content} className="w-full max-h-96 object-contain" alt="Generated AI Art" />
                                                        <div className="p-3 bg-slate-950 flex justify-between items-center">
                                                            <p className="text-xs text-slate-400 truncate w-3/4">"{msg.prompt}"</p>
                                                            <button onClick={() => downloadImage(msg.content, msg.id)} className="flex items-center gap-1 text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition-colors">
                                                                <Icons.Download /> Save
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                                
                                                {/* Action Bar (Copy) for Bot */}
                                                {msg.role === 'bot' && msg.type === 'text' && (
                                                    <div className="absolute -bottom-8 left-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => copyToClipboard(msg.content, msg.id)} className="flex items-center gap-1 text-xs text-slate-400 hover:text-white bg-slate-900 px-2 py-1 rounded border border-slate-700">
                                                            {copiedId === msg.id ? <Icons.Check /> : <Icons.Copy />} {copiedId === msg.id ? "Copied" : "Copy"}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    
                                    {/* Typing Indicator */}
                                    {isGenerating && (
                                        <div className="flex gap-4">
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shrink-0 animate-pulse"><span className="text-xs font-bold text-white">R</span></div>
                                            <div className="bg-transparent px-5 py-3 space-y-3 w-64">
                                                <div className="h-2 bg-slate-700 rounded w-full animate-pulse"></div>
                                                <div className="h-2 bg-slate-700 rounded w-4/5 animate-pulse"></div>
                                                <div className="h-2 bg-slate-700 rounded w-1/2 animate-pulse"></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                            <div ref={messagesEndRef}></div>
                        </div>

                        {/* Input Area */}
                        <div className="p-4 md:px-8 pb-6 w-full max-w-4xl mx-auto bg-[#020617] pt-2">
                            <form onSubmit={handleSend} className="relative bg-slate-900 border border-slate-700 rounded-2xl shadow-xl focus-within:border-indigo-500/50 transition-colors flex items-end p-2">
                                <textarea 
                                    value={input} 
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                                    placeholder={mode === 'chat' ? "Message Rayyan AI..." : "Describe the image you want to generate..."}
                                    className="w-full bg-transparent text-white placeholder-slate-500 p-3 max-h-32 resize-none outline-none text-[15px] custom-scrollbar"
                                    rows="1"
                                    style={{height: input ? 'auto' : '52px'}}
                                />
                                <button type="submit" disabled={!input.trim() || isGenerating} className={`p-3 rounded-xl ml-2 shrink-0 transition-colors ${input.trim() && !isGenerating ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500'}`}>
                                    <Icons.Send />
                                </button>
                            </form>
                            <p className="text-center text-xs text-slate-500 mt-3">Rayyan AI can make mistakes. Consider verifying important information.</p>
                        </div>
                    </main>

                    {/* SETTINGS MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                                <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2"><Icons.Settings /> AI Persona Settings</h3>
                                <div className="space-y-2 mb-6">
                                    <label className="text-xs text-slate-400 font-semibold uppercase">System Instructions (How AI behaves)</label>
                                    <textarea 
                                        value={systemInstruction} 
                                        onChange={(e) => setSystemInstruction(e.target.value)}
                                        rows="4" 
                                        className="w-full bg-[#020617] border border-slate-700 rounded-lg p-3 text-sm text-slate-300 outline-none focus:border-indigo-500"
                                    ></textarea>
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setShowSettings(false)} className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition-colors">Save & Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
